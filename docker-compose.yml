name: cxt-heatmap

services:
  web-backend:
    image: michaelschmidt123/cxt-heatmap:latest
    platform: linux/amd64
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - MQTT_URL=mqtt://mqtt:1883
      - MQTT_USER=cxt
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_USER=${DISCORD_USER}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - NETATMO_CLIENT_ID=${NETATMO_CLIENT_ID}
      - NETATMO_CLIENT_SECRET=${NETATMO_CLIENT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cxt.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.cxt.entrypoints=websecure"
      - "traefik.http.routers.cxt.tls.certresolver=myresolver"
      - "traefik.http.services.cxt.loadbalancer.server.port=3000"
    depends_on:
      - influxdb
      - mqtt
    restart: always
    networks:
      - traefik

  influxdb:
    image: influxdb:2.7.4
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
      - DOCKER_INFLUXDB_INIT_BUCKET=cxt
      - DOCKER_INFLUXDB_INIT_ORG=cxt
    volumes:
      - ./influxdata:/var/lib/influxdb2
      - ./influxconfig:/etc/influxdb2
    networks:
      - traefik

  mqtt:
    image: eclipse-mosquitto:2.0.18
    ports:
      - 1883:1883
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto.passwd:/mosquitto/config/mosquitto.passwd:ro
    networks:
      - traefik

  traefik:
    image: "traefik:2.3.7"
    container_name: "traefik"
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      #- CF_API_EMAIL=${CF_API_EMAIL}
    volumes:
      - ./traefik/config:/etc/traefik
      - ./traefik/certs:/certs
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - traefik
    depends_on:
      - web-backend

networks:
  traefik:
